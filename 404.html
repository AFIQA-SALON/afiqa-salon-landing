<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan | AFIQA SALON</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .error-container {
            text-align: center;
            padding: 2rem;
        }
        
        .error-code {
            font-size: 150px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 1rem;
            animation: fadeIn 0.8s;
        }
        
        .error-message {
            font-size: 2rem;
            margin-bottom: 1rem;
            animation: fadeIn 1s;
        }
        
        .error-description {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            animation: fadeIn 1.2s;
        }
        
        .home-button {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 1rem 2.5rem;
            border-radius: 30px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s;
            animation: fadeIn 1.4s;
        }
        
        .home-button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .emoji {
            font-size: 80px;
            display: block;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <span class="emoji">💇‍♀️</span>
        <h1 class="error-code">404</h1>
        <h2 class="error-message">Halaman Tidak Ditemukan</h2>
        <p class="error-description">Maaf, halaman yang Anda cari tidak tersedia.<br>Mari kembali ke halaman utama!</p>
        <a href="/" class="home-button">Kembali ke Beranda</a>
    </div>
</body>
</html>
